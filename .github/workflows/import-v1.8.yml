name: Import verified Memory Palace OS V1.8.0

on:
  push:
    branches:
      - import/v1.8.0

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and import the exact V1.8.0 tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          tmp="$(mktemp -d)"
          git clone --quiet --single-branch --branch import/v1.8.0 "$remote" "$tmp/work"
          bundle="$tmp/work/.github/import/memory-palace-os-v1.8.0.bundle"
          test -s "$bundle"

          git -C "$tmp/work" fetch --quiet "$bundle" refs/heads/main:refs/remotes/bundle/main
          original_commit="$(git -C "$tmp/work" rev-parse refs/remotes/bundle/main)"
          original_tree="$(git -C "$tmp/work" rev-parse "${original_commit}^{tree}")"
          test "$original_tree" = "8281bcf5172cc1aacfba083580979ed89f2a5c27"
          original_count="$(git -C "$tmp/work" ls-tree -r --name-only "$original_commit" | wc -l | tr -d ' ')"
          test "$original_count" = "217"

          git -C "$tmp/work" fetch --quiet origin refs/heads/main:refs/remotes/origin/main
          current_commit="$(git -C "$tmp/work" rev-parse refs/remotes/origin/main)"
          current_tree="$(git -C "$tmp/work" rev-parse "${current_commit}^{tree}")"

          python3 - "$tmp/work" "$current_commit" "$original_commit" <<'PY'
          import subprocess, sys
          repo, current, original = sys.argv[1:]
          def entries(ref):
              raw = subprocess.check_output(["git", "-C", repo, "ls-tree", "-r", "-z", ref])
              result = {}
              for record in raw.split(b"\\0"):
                  if not record:
                      continue
                  meta, path = record.split(b"\\t", 1)
                  result[path] = meta
              return result
          old, new = entries(current), entries(original)
          mismatches = [p.decode("utf-8", "replace") for p, v in old.items() if new.get(p) != v]
          if mismatches:
              print("STOP: existing remote files differ from the verified V1.8.0 snapshot:")
              print("\\n".join(mismatches[:30]))
              raise SystemExit(2)
          print(f"Verified {len(old)} existing remote files against the {len(new)}-file original snapshot.")
          PY

          if [ "$current_tree" = "$original_tree" ]; then
            echo "V1.8.0 source tree is already complete; no source commit needed."
            exit 0
          fi

          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          new_commit="$(printf '%s\\n' 'Import complete verified Memory Palace OS V1.8.0 source tree' | git -C "$tmp/work" commit-tree "$original_tree" -p "$current_commit")"
          git -C "$tmp/work" push origin "$new_commit:refs/heads/main"

          git -C "$tmp/work" fetch --quiet origin refs/heads/main:refs/remotes/origin/main
          verified_tree="$(git -C "$tmp/work" rev-parse refs/remotes/origin/main^{tree})"
          verified_count="$(git -C "$tmp/work" ls-tree -r --name-only refs/remotes/origin/main | wc -l | tr -d ' ')"
          test "$verified_tree" = "$original_tree"
          test "$verified_count" = "217"
          echo "SUCCESS: $verified_count/217 source files verified; tree $verified_tree; commit $new_commit"

          if ! git ls-remote --exit-code --tags origin refs/tags/v1.8.0 >/dev/null 2>&1; then
            git -C "$tmp/work" push origin "$new_commit:refs/tags/v1.8.0"
            echo "Created tag v1.8.0."
          else
            echo "Tag v1.8.0 already exists; left unchanged."
          fi
