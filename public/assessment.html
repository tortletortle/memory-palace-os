<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立知识测评 · Memory Palace OS</title><style>
:root{font-family:system-ui,sans-serif;color:#263a30;background:#f0f4ed}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:32px 18px 64px}a{color:#315e47}h1{font-size:clamp(26px,5vw,38px);margin:18px 0 8px}p{line-height:1.65;color:#4a6052}section{background:#fff;border:1px solid #d7e2d6;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 6px 20px #315e4709}label{display:block;font-size:14px;font-weight:600;margin:15px 0 7px}select,textarea,input,button{font:inherit;border-radius:10px;border:1px solid #c4d3c5;padding:12px;width:100%;background:white}textarea{min-height:110px;resize:vertical}button{background:#315e47;color:#fff;font-weight:600;cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#fff;color:#315e47}small{color:#526658}#question,#reference,#locked-answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}#reference{background:#edf5ed;padding:16px;border-radius:12px}#status{min-height:1.5em;color:#8c4028}#report{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{border:1px solid #d7e2d6;padding:15px;border-radius:12px}.metric strong{font-size:27px;display:block}details summary{cursor:pointer;font-weight:600} [hidden]{display:none!important}
</style></head><body><main><a href="/">← 返回记忆宫殿</a><h1>独立知识测评</h1><p>在不显示三维场景、物体位置和原文的情况下作答。以下结果是自评练习数据，不是客观能力认证。</p><section id="selection"><label for="palace">选择已保存的宫殿</label><select id="palace"></select><label for="kind">测评类型</label><select id="kind"><option value="free-recall">独立知识回忆（给出知识名称）</option><option value="transfer">迁移练习（人工编写的新情境）</option></select><label for="item">题目</label><select id="item"></select><button id="start">开始作答</button><div id="pending" hidden><label for="pending-item">待完成评分</label><select id="pending-item"></select><button id="resume" class="secondary">继续评分</button></div><details id="author"><summary>编写迁移练习题（作者模式）</summary><p>建议由他人提供新情境与参考答案。自己编题会提前接触答案，不能作为独立留出实验。</p><label for="concept">对应知识点</label><select id="concept"></select><label for="prompt">新情境题目</label><textarea id="prompt" maxlength="2000"></textarea><label for="key">参考答案与评分要点</label><textarea id="key" maxlength="4000"></textarea><button id="add" class="secondary">保存迁移题</button></details></section><section id="exercise" hidden><small id="mode"></small><h2 id="question"></h2><div id="writing"><label for="answer">请独立作答</label><textarea id="answer" maxlength="4000" placeholder="如果不知道，可以直接填写“不知道”。"></textarea><button id="submit">锁定答案并查看参考</button></div><div id="feedback" hidden><h3>你的已锁定答案</h3><p id="locked-answer"></p><h3>参考材料 / 评分要点</h3><div id="reference"></div><p>参考材料可能不完整。不能可靠判断时选择“不确定”，不要机械比较文字。</p><label for="grade">自评</label><select id="grade"><option value="">请选择</option><option value="correct">正确：关键内容完整</option><option value="partial">部分正确：存在明显遗漏</option><option value="missed">错误或无法回忆</option><option value="uncertain">不确定，无法可靠判断</option></select><button id="save-grade">保存评分</button></div><button id="back" class="secondary">返回题目列表</button></section><div role="status" id="status"></div><section><h2>测评记录</h2><p>仅统计每个题目版本的首次提交，避免重复做同一道题导致成绩虚高。不确定及未评分分别列出。</p><div id="report"></div><button id="export" class="secondary">导出原始测评 JSON</button></section></main><script type="module" src="/assessment.js"></script></body></html>
